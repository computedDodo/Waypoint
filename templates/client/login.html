{% extends "base.html" %}
{% block title %}Client Login — Waypoint{% endblock %}
{% block brand_tag %}client portal{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <h2>Client portal</h2>
    <p style="font-size:.85rem;color:var(--paper-dim);margin:0 0 1.5rem;">Track your campaigns and export your data.</p>
    <form method="POST" action="{{ url_for('client_portal.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" required autofocus>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>
    <div class="auth-switch"><a href="{{ url_for('client_portal.forgot_password') }}">Forgot your password?</a></div>
  </div>
</div>
{% endblock %}
