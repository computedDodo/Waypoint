{% extends "base.html" %}
{% block title %}Forgot Password — Waypoint{% endblock %}
{% block brand_tag %}client portal{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <h2>Forgot your password?</h2>
    <p style="font-size:.85rem;color:var(--paper-dim);margin:0 0 1.5rem;">Enter the email on your account.</p>
    <form method="POST" action="{{ url_for('client_portal.forgot_password') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
    </form>
    <div class="auth-switch"><a href="{{ url_for('client_portal.login') }}">&larr; Back to sign in</a></div>
  </div>
</div>
{% endblock %}
