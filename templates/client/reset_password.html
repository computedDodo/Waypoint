{% extends "base.html" %}
{% block title %}Set Password — Waypoint{% endblock %}
{% block brand_tag %}client portal{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <h2>Set your password</h2>
    <form method="POST" action="{{ url_for('client_portal.reset_password', token=token) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label>New password</label>
        <input type="password" name="password" required minlength="8" autofocus>
      </div>
      <div class="field">
        <label>Confirm new password</label>
        <input type="password" name="confirm_password" required minlength="8">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Set password</button>
    </form>
  </div>
</div>
{% endblock %}
