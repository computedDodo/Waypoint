{% extends "base.html" %}
{% block title %}Forgot Password — Waypoint{% endblock %}
{% block brand_tag %}reset your password{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <h2>Forgot your password?</h2>
    <p style="font-size:.85rem;color:var(--paper-dim);margin:0 0 1.5rem;">
      Enter your username or email and we'll send a reset link.
    </p>
    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label>Username or email</label>
        <input type="text" name="identifier" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
    </form>
    <div class="auth-switch"><a href="{{ url_for('auth.login') }}">&larr; Back to sign in</a></div>
  </div>
</div>
{% endblock %}
