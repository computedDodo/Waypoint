{% extends "base.html" %}
{% block title %}New Campaign — Waypoint{% endblock %}
{% block content %}
<a href="{{ url_for('campaigns.list_campaigns') }}" style="color:var(--amber); font-size:.85rem; text-decoration:none;">&larr; Campaigns</a>
<h2>New campaign</h2>

{% if not clients %}
<div class="card empty-state">
  You need a client before you can create a campaign.
  <div style="margin-top:1rem;"><a href="{{ url_for('clients.new_client') }}" class="btn btn-primary">Add a client</a></div>
</div>
{% else %}
<div class="card" style="max-width:560px;">
  <form method="POST" action="{{ url_for('campaigns.new_campaign') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label>Client</label>
      <select name="client_id" required>
        <option value="">Select a client…</option>
        {% for client in clients %}
        <option value="{{ client.id }}" {{ 'selected' if preselected_client_id == client.id }}>{{ client.company_name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label>Campaign name</label>
      <input type="text" name="name" required placeholder="e.g., Checkout & Notifications QA">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Target app</label>
        <input type="text" name="target_app_name" placeholder="e.g., Lumo Health app">
      </div>
      <div class="field">
        <label>Platform</label>
        <select name="platform">
          <option>Web</option>
          <option>iOS</option>
          <option>Android</option>
          <option>Cross-platform</option>
        </select>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Points budget</label>
        <input type="number" name="points_budget" min="0" value="1000">
      </div>
      <div class="field">
        <label>&#8358; per point</label>
        <input type="number" name="conversion_rate" min="0" step="0.001" value="0.01">
      </div>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Create campaign (as Draft)</button>
  </form>
</div>
{% endif %}
{% endblock %}
